<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cálculo Hipoteca Inversa</title>
</head>
<body>
    <h1>Simulador de Hipoteca Inversa</h1>

    <form action="/calcular_cuota" method="POST">
        <label>Nombre (opcional):</label>
        <input type="text" name="nombre" maxlength="100"><br>

        <label>Valor del Inmueble:</label>
        <input type="number" name="valor_inmueble" step="any" required><br>

        <label>Porcentaje a Financiar (%):</label>
        <input type="number" name="porcentaje" step="any" required><br>

        <label>Tasa de Interés Mensual (%):</label>
        <input type="number" name="tasa_mensual" step="any" required><br>

        <label>Plazo Meses:</label>
        <input type="number" name="plazo_meses" required><br>

        <button type="submit">Calcular</button>
    </form>

    <p><a href="/consultas">Ver consultas</a></p>

    <h2>Uso por primera vez</h2>
    <p>Si está usando una base de datos nueva, <a href="/crear_tablas">haga clic aquí para crear las tablas</a>.</p>
</body>
</html>
